name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ferricstore_image:
        description: "FerricStore image for integration tests"
        required: false
        default: "quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src/ferricstore

      - name: Pytest
        run: python -m pytest --cov=ferricstore --cov-report=term-missing --cov-report=json:coverage.json

      - name: Critical module coverage
        run: python scripts/check_critical_coverage.py coverage.json

      - name: Dependency consistency
        run: python -m pip check

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  integration:
    name: FerricStore integration
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: ${{ inputs.ferricstore_image || 'quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Checkout FerricStore server
        if: ${{ env.FERRICSTORE_IMAGE == 'ferricstore-sdk-ci:local' }}
        uses: actions/checkout@v6
        with:
          repository: ferricstore/ferricstore
          path: ferricstore-server

      - name: Build FerricStore image
        if: ${{ env.FERRICSTORE_IMAGE == 'ferricstore-sdk-ci:local' }}
        run: docker build -t ferricstore-sdk-ci:local ferricstore-server

      - name: Run native integration tests
        run: scripts/run_native_integration.sh
      - name: Run authenticated TLS HTTP integration tests
        env:
          FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5
        run: scripts/run_http_integration.sh
